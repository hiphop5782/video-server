<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests"> -->
	<title>Video Player</title>
	<link rel="icon" type="image/x-icon" href="./image/favicon.ico">
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    
	<link rel="stylesheet" type="text/css" href="https://vjs.zencdn.net/8.0.4/video-js.css">
	<link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.2.3/cerulean/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="./css/sidebars.css">
	<link rel="stylesheet" type="text/css" href="./css/main.css">
</head>
<body>
	<div id="app" class="container-fluid" v-cloak>
		<div class="d-flex flex-column align-items-stretch flex-shrink-0 bg-white sidebar">
		    <div class="sidebar-header">
			    <a href="#" class="d-flex align-items-center flex-shrink-0 p-3 link-dark text-decoration-none border-bottom">
			    	<img class="bi me-2" width="30" height="24" src="./image/favicon.ico">
			      	<span class="fs-5 fw-semibold">Video Player</span>
			    </a>
			    <div class="row" v-if="user != null">
			    	<div class="col pt-1 pb-1 pe-4">
						<div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input ref="searchInput" type="search" class="form-control" placeholder="영상 검색" autocomplete="off" v-model.trim="keyword"><button v-if="keyword" @click="clearSearch" aria-label="검색어 지우기"><i class="fa-solid fa-xmark"></i></button></div>
						<div class="list-meta"><span>{{searchResults.length}}개 영상</span><button @click="logout">로그아웃</button></div>
			    	</div>
			    </div>
				<div class="row" v-else>
					<div class="col pt-1 pb-1 pe-4">
						<button class="btn btn-outline-primary w-100" :disabled="loading" @click="githubSignIn">
							<i class="fa-brands fa-github"></i>
							{{loading ? '로그인 중…' : 'Github 로그인'}}
						</button>						
					</div>
				</div>
		    </div>
<!-- 		    <div class="list-group list-group-flush border-bottom scrollarea" v-for="(video, index) in videos" :key="index"> -->
			<div v-if="user && loading" class="list-message"><span class="spinner-border spinner-border-sm"></span> 영상 목록을 불러오는 중입니다</div>
			<div v-else-if="user && videos.length === 0" class="list-message"><i class="fa-regular fa-folder-open"></i><strong>조회된 영상이 없습니다</strong><small>잠시 후 다시 시도하거나 관리자에게 문의해 주세요.</small><button class="btn btn-sm btn-outline-primary" @click="loadVideos">다시 조회</button></div>
			<div v-else-if="user && searchResults.length === 0" class="list-message"><i class="fa-solid fa-magnifying-glass"></i><strong>검색 결과가 없습니다</strong><small>다른 검색어로 찾아보세요.</small><button class="btn btn-sm btn-outline-secondary" @click="clearSearch">검색 초기화</button></div>
			<div v-else class="virtual-list" ref="virtualList" @scroll="handleListScroll">
				<div class="virtual-spacer" :style="{height: virtualTotalHeight + 'px'}">
					<div v-for="row in virtualRows" :key="row.video" class="virtual-row" :style="{transform: `translateY(${row.top}px)`}">
						<button class="list-group-item list-group-item-action lh-tight" @click="selectVideo(row.video)" :class="{active:currentVideo === row.video}" :title="row.video">
							<i class="fa-regular fa-circle-play me-2"></i><span>{{displayName(row.video)}}</span><small v-if="progressPercent(row.video) > 0">{{progressPercent(row.video)}}%</small>
							<span v-if="progressPercent(row.video) > 0" class="item-progress" :style="{width: progressPercent(row.video) + '%'}"></span>
						</button>
					</div>
				</div>
			</div>
		</div>
		<div class="video-container">
			<div v-if="currentVideo" class="top-progress" role="progressbar" aria-label="영상 시청 진행률" :aria-valuenow="currentProgress" aria-valuemin="0" aria-valuemax="100"><div class="top-progress-bar" :style="{width: currentProgress + '%'}"></div></div>
			<div v-if="errorMessage" class="alert alert-danger d-flex justify-content-between"><span>{{errorMessage}}</span><button class="btn btn-sm btn-outline-danger" @click="loadVideos">다시 시도</button></div>
			<video
			    class="video-js vjs-big-play-centerd vjs-fluid video-player"
			    id="video-player"
			    poster="./image/hacademy.png"
			  ></video>
			<div v-if="user && !loading && !currentVideo && videos.length" class="player-message"><i class="fa-regular fa-circle-play"></i><strong>재생할 영상을 선택해 주세요</strong><span>왼쪽 목록에서 원하는 영상을 고를 수 있습니다.</span></div>
			<div class="row mt-4" v-if="currentVideo != null">
				<div class="col">
					<h2>
						{{displayName(currentVideo)}}
					</h2>
                    <button type="button" class="btn btn-outline-secondary me-2" @click="ss">처음</button>
                    <button type="button" class="btn btn-outline-secondary me-2" @click="rr(10)">-10s</button>
                    <button type="button" class="btn btn-outline-secondary me-2" @click="rr(5)">-5s</button>
                    <button type="button" class="btn btn-outline-secondary me-2" @click="ff(5)">+5s</button>
                    <button type="button" class="btn btn-outline-secondary me-2" @click="ff(10)">+10s</button>						
				</div>
			</div>
			<div class="row mt-2" v-if="currentVideo != null">
				<div class="col">
					<button type="button" class="btn btn-outline-secondary me-2" :class="{active:playbackRate===1}" @click="speed(1)">x1</button>
                    <button type="button" class="btn btn-outline-secondary me-2" @click="speed(1.2)">x1.2</button>
                    <button type="button" class="btn btn-outline-secondary me-2" @click="speed(1.5)">x1.5</button>
                    <button type="button" class="btn btn-outline-secondary me-2" @click="speed(2)">x2</button>
					<button v-if="nextVideo" type="button" class="btn btn-primary me-2" @click="playNext"><i class="fa-solid fa-forward-step me-1"></i>다음 영상</button>
				</div>
			</div>
			<div v-if="currentVideo" class="form-check form-switch mt-3"><input id="auto-next" class="form-check-input" type="checkbox" v-model="autoPlayNext"><label class="form-check-label" for="auto-next">영상 종료 후 다음 영상 자동 재생</label></div>
			<div v-if="currentVideo" class="shortcut-guide mt-3">
				<strong><i class="fa-regular fa-keyboard me-2"></i>키보드 단축키</strong>
				<span><kbd>←</kbd> 10초 이전</span>
				<span><kbd>→</kbd> 10초 이후</span>
			</div>
		</div>
	</div>
	
	<script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.8/axios.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.2.3/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.2.46/vue.global.min.js"></script>
	<script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>
	<script src="./js/sidebars.js"></script>
	<script src="./js/main.js" type="module"></script>
</body>
</html>
