server:
  port: ${SERVER_PORT:30000}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  datasource:
    url: ${ACCESS_DB_URL:jdbc:h2:file:./data/video-access;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${ACCESS_DB_USERNAME:sa}
    password: ${ACCESS_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mvc:
    static-path-pattern: /static/**
  web:
    resources:
      static-locations: classpath:/static/

custom:
  file:
    path: ${VIDEO_ROOT:D:/share}
  github:
    enabled: ${GITHUB_ENABLED:true}
    owner: ${GITHUB_OWNER:hiphop5782}
    repositories:
      - kh14
      - kh15
      - kh16
      - kh17-be
      - the01
    base-url: https://api.github.com
    api-version: 2022-11-28
    token: ${GITHUB_TOKEN:}
  firebase:
    base-url: https://identitytoolkit.googleapis.com
    api-key: ${FIREBASE_API_KEY:AIzaSyBMVq-lq8w-YHP7X8gd6kU3lh0g2mf-4qo}
  security:
    admin-password: ${VIDEO_ADMIN_PASSWORD:}
    viewer-session-hours: ${VIEWER_SESSION_HOURS:12}
    admin-session-hours: ${ADMIN_SESSION_HOURS:2}
    cookie-secure: ${COOKIE_SECURE:true}
